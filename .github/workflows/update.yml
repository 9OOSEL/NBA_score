name: NBA 데이터 갱신

on:
  # NBA.com이 GitHub 서버 접속을 막아서 자동 실행은 꺼 둠 (집 컴퓨터의 update.bat이 갱신 담당)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install nba_api
      - run: python scripts/update_data.py
      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet || git commit -m "데이터 갱신 $(date -u +%F)"
          git push
