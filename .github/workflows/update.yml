name: NBA 데이터 갱신

on:
  schedule:
    - cron: "17 7 * * *"   # 매일 한국 시간 오후 4시 17분 (미국 경기가 모두 끝난 뒤)
  workflow_dispatch:        # Actions 탭에서 수동 실행

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python scripts/update_cdn.py
      - name: 바뀐 데이터 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898900+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json data/
          git diff --cached --quiet || git commit -m "데이터 갱신 $(TZ=Asia/Seoul date +%F)"
          git push
